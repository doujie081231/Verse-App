# 2GB 内存机器：收紧 Gradle/Kotlin 内存上限并降低并行度，避免内存耗尽
# 导致 Kotlin daemon 无法启动（超内存时 Kotlin 会 fallback 进程内编译，
# 中文路径被 unicode 转义报 "source file or directory not found"）
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true

kotlin.code.style=official

android.defaults.buildfeatures.buildconfig=true
