name: horizon-derived

# 生成 Horizon 安卓端需要的派生包（horizon-derived.zip，约 4MB）。
#
# 包里的 facts.json / horizon-resources.json 由 Horizon 自研的 Java 导出器产出
# （见 crates/horizon-prepare），手机端跑不了，只能在有 Rust + JDK 的机器上生成一次。
# 产物挂到本仓库 release，把下载地址填进 VerseApp/src/main/assets/horizon_meta.json
# 的 derivedUrl，启动器即可直接下载，用户无需电脑。
#
# 注意：派生数据来自 Mojang 的游戏文件，上游脚本注明 "Not for publishing"，
# 是否公开托管由项目所有者决定。

on:
  push:
    paths:
      - ".github/workflows/horizon-derived.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          path: self

      - name: Checkout port source
        uses: actions/checkout@v4
        with:
          repository: Rayan-XOO/horizon
          ref: android-v0.4.7
          path: port
          fetch-depth: 1

      - name: Resolve port commit
        id: sha
        run: echo "short=$(git -C port rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: port

      - name: Download Minecraft 26.3 server jar
        env:
          MANIFEST: https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
        run: |
          set -euo pipefail
          curl -fsSL "$MANIFEST" -o manifest.json
          VERSION_URL=$(jq -r '.versions[] | select(.id=="26.3") | .url' manifest.json)
          curl -fsSL "$VERSION_URL" -o version.json
          JAR_URL=$(jq -r '.downloads.server.url' version.json)
          curl -fL --retry 3 -o server.jar "$JAR_URL"
          ls -la server.jar

      - name: Build a fake .minecraft with 26.3 installed
        run: |
          set -euo pipefail
          python3 self/tools/fetch_mc_ci.py "$HOME/.minecraft"
          ls -la "$HOME/.minecraft/versions/26.3"

      - name: Accept Mojang's current 26.3 version file
        run: |
          set -euo pipefail
          python3 self/tools/patch_horizon_lock.py port "$HOME/.minecraft"

      - name: Prepare game files (runs the Java exporters)
        working-directory: port
        run: |
          set -euo pipefail
          cargo run --release -p horizon-prepare -- --prepare --server-jar ../server.jar --minecraft-dir "$HOME/.minecraft"

      - name: Pack derived zip
        working-directory: port
        run: |
          set -euo pipefail
          chmod +x packaging/android/make_derived_pack.sh
          packaging/android/make_derived_pack.sh
          ls -la target/android/horizon-derived.zip
          sha256sum target/android/horizon-derived.zip > ../horizon-derived.zip.sha256
          cat ../horizon-derived.zip.sha256

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: derived-${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Horizon derived pack ($TAG)" --notes "自动生成，对应 Rayan-XOO/horizon@${{ steps.sha.outputs.short }}" || true
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" port/target/android/horizon-derived.zip horizon-derived.zip.sha256 --clobber
          echo "asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/horizon-derived.zip"
