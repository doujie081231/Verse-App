name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" --channel=3 2>&1 | tail -3
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" 2>&1 | tail -3
          cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          sed -i 's|platforms;android-37.0|platforms;android-37|g' "$ANDROID_HOME/platforms/android-37/source.properties" || true
          echo "--- android-37 ?? ---"
          ls "$ANDROID_HOME/platforms/android-37" | head -5

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :VerseApp:assembleDebug -Darch=arm64 --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Verse-2.4.63-APK
          path: VerseApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
